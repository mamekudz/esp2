; ESP][ Phase 1 — hardware bring-up baseline
; Target: Waveshare ESP32-S3-Touch-AMOLED-1.64 (280x456, CO5300, FT3168)
;
; Why pioarduino (not stock PlatformIO espressif32):
; Arduino_GFX CO5300/QSPI needs Arduino-ESP32 3.x. Stock PlatformIO
; espressif32@6.12.0 still ships Arduino 2.0.x. pioarduino packages the
; Arduino IDE-compatible 3.x toolchain.
;
; Why pin 55.03.32 (not "stable"):
; On this Windows host, pioarduino "stable" (55.03.312) entered an infinite
; tool reinstall loop (file:// tools <-> HTTPS packages). 55.03.32 is the
; pin used successfully by jaapp's exact-board PlatformIO port.
; Refs:
;   https://github.com/pioarduino/platform-espressif32
;   https://github.com/jaapp/waveshare-amoled164-lvgl9-platformio
;   https://github.com/trane77/Waveshare-ESP32-S3-Touch-AMOLED-1.64-PlatformIO

[platformio]
default_envs = bringup
description = ESP][ Phase 1 hardware bring-up

[env:bringup]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.32/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi

upload_speed = 921600
upload_port = COM5
monitor_speed = 115200
monitor_port = COM5
monitor_filters = time, default

build_flags =
    -Iinclude
    -Wall
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=0
    -DESP_BRACKET_PHASE1=1

lib_deps =
    moononournation/GFX Library for Arduino @ ^1.6.0
    h2zero/NimBLE-Arduino @ 1.4.3

; Keep pioarduino esptool 5.x (stock PlatformIO registry can pull 4.5.x).
platform_packages =
    tool-esptoolpy@https://github.com/pioarduino/registry/releases/download/0.0.1/esptoolpy-v5.1.0.zip

; ---------------------------------------------------------------------------
; COMPILE-ONLY emulator-core smoke (Level-5 readiness). Do NOT flash by default.
; ---------------------------------------------------------------------------
[env:core_smoke]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.32/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200

build_src_filter =
    +<core_smoke/>
    -<main.cpp>
    -<display_power.cpp>
    -<ble_*.cpp>
    -<qmi8658_min.cpp>

build_flags =
    -Iinclude
    -Ihost/include
    -Ihost/src/apple2
    -Ithird_party/fake6502
    -Wall
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=0
    -DESP_BRACKET_CORE_SMOKE=1

extra_scripts =
    pre:firmware/core_smoke/add_sources.py

platform_packages =
    tool-esptoolpy@https://github.com/pioarduino/registry/releases/download/0.0.1/esptoolpy-v5.1.0.zip

; ---------------------------------------------------------------------------
; First PHYSICAL Apple II text-core port (Sharp only). Flash COM5 to verify.
; ---------------------------------------------------------------------------
[env:apple2_text]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.32/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
upload_speed = 921600
upload_port = COM5
monitor_speed = 115200
monitor_port = COM5
monitor_filters = time, default

build_src_filter =
    +<apple2_text/>
    +<display_power.cpp>
    +<qmi8658_min.cpp>
    +<serial_media_upload.cpp>
    +<sd_ownership.cpp>
    +<usb_storage_mode.cpp>
    +<i18x_fw.cpp>
    -<main.cpp>
    -<core_smoke/>
    -<ble_*.cpp>

build_flags =
    -Iinclude
    -Ihost/include
    -Ihost/src/apple2
    -Ithird_party/fake6502
    -Wall
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=0
    -DESP_BRACKET_APPLE2_TEXT=1
    -DESP2_USB_MSC=0

lib_deps =
    moononournation/GFX Library for Arduino @ ^1.6.0

extra_scripts =
    pre:firmware/apple2_text/add_sources.py

platform_packages =
    tool-esptoolpy@https://github.com/pioarduino/registry/releases/download/0.0.1/esptoolpy-v5.1.0.zip
