  <title id="title">ESP][ Birnenlogo</title>
  <desc id="description">Flächige Vektorinterpretation der Bildvorlage. Sieben horizontale Regenbogenstreifen, schwarze Birnenkontur, grünes Blatt, brauner Stiel, drei cremefarbene Leiterbahnen und ESP][ als editierbare Pfade. Transparenter Hintergrund; keine Rasterbilder, Verläufe, Filter oder Schriftabhängigkeiten.</desc>
